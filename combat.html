<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Combat — Campaign Tracker</title>
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;600;900&family=Crimson+Text:ital,wght@0,400;0,600;1,400&display=swap" rel="stylesheet">
<script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-firestore-compat.js"></script>
<script src="firebase-config.js"></script>
<style>
:root {
  --gold: #9a7000;
  --gold-light: #c8a84b;
  --parchment: #f5e6c8;
  --parchment-dark: #d4b896;
  --red: #7a1515;
  --green: #2a5a18;
  --bg: #080604;
  --ink: #1a0e04;
  --ink-light: #3a2a1a;
  --border: #4a3420;
  --border-light: #6a5040;
}

* { box-sizing: border-box; margin: 0; padding: 0; }

body {
  display: flex;
  flex-direction: column;
  height: 100vh;
  overflow: hidden;
  background: var(--bg);
  color: var(--parchment);
  font-family: 'Crimson Text', serif;
}

/* ── TOP BAR ── */
#top-bar {
  height: 48px;
  flex-shrink: 0;
  background: #050302;
  border-bottom: 1px solid var(--border);
  display: flex;
  align-items: center;
  padding: 0 14px;
  gap: 0;
}
#top-bar-spacer-left,
#top-bar-spacer-right {
  flex: 0 0 160px;
}
#top-bar-center {
  flex: 1;
  text-align: center;
}
#back-btn {
  font-family: 'Cinzel', serif;
  font-size: 0.55rem;
  text-transform: uppercase;
  letter-spacing: 0.15em;
  color: var(--border-light);
  background: none;
  border: 1px solid var(--border);
  border-radius: 2px;
  padding: 5px 12px;
  cursor: pointer;
  transition: color 0.15s, border-color 0.15s;
  white-space: nowrap;
}
#back-btn:hover { color: var(--gold-light); border-color: var(--gold); }

#round-display {
  font-family: 'Cinzel', serif;
  font-size: 0.75rem;
  letter-spacing: 0.1em;
}
#round-label { color: var(--border-light); }
#round-num   { color: var(--gold-light); font-size: 1.1rem; font-weight: 600; }
#round-sep   { color: var(--border-light); margin: 0 6px; }
#round-cond  { color: var(--border-light); }

/* ── MAIN AREA ── */
#main-area {
  display: flex;
  flex: 1;
  overflow: hidden;
}

/* ── LEFT QUEUE ── */
#turn-queue {
  width: 260px;
  flex-shrink: 0;
  background: #0a0704;
  border-right: 1px solid var(--border);
  padding: 12px;
  overflow-y: auto;
  display: flex;
  flex-direction: column;
  gap: 0;
}
#queue-label {
  font-family: 'Cinzel', serif;
  font-size: 0.52rem;
  text-transform: uppercase;
  letter-spacing: 0.15em;
  color: var(--gold);
  margin-bottom: 10px;
}
#queue-cards {
  display: flex;
  flex-direction: column;
  gap: 6px;
  flex: 1;
}
#end-turn-btn {
  font-family: 'Cinzel', serif;
  font-size: 0.6rem;
  text-transform: uppercase;
  letter-spacing: 0.1em;
  background: rgba(154,112,0,0.2);
  border: 1px solid var(--gold);
  color: var(--gold-light);
  width: 100%;
  padding: 10px;
  border-radius: 3px;
  cursor: pointer;
  margin-top: 8px;
  transition: background 0.15s;
  display: none;
}
#end-turn-btn:hover { background: rgba(154,112,0,0.35); }

/* ── COMBATANT CARD ── */
.cc {
  background: #141008;
  border: 1px solid var(--border);
  border-radius: 4px;
  padding: 10px 12px;
  transition: all 0.3s ease;
}
.cc.active-turn {
  border-color: var(--gold);
  box-shadow: 0 0 12px rgba(154,112,0,0.35);
  background: #1c1400;
}
.cc.active-turn.is-me {
  border-color: var(--gold-light);
  box-shadow: 0 0 18px rgba(200,168,75,0.5);
  background: #1c1800;
}
.cc.is-enemy {
  border-color: #3a1818;
  background: #120808;
}
.cc.is-enemy.active-turn {
  border-color: var(--red);
  box-shadow: 0 0 12px rgba(122,21,21,0.45);
  background: #180808;
}
.cc.unconscious { opacity: 0.4; }

.cc-header {
  display: flex;
  align-items: center;
  justify-content: space-between;
  margin-bottom: 6px;
}
.cc-name {
  font-family: 'Cinzel', serif;
  font-size: 0.75rem;
  font-weight: 600;
  color: var(--parchment);
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
  max-width: 140px;
}
.cc-badge {
  font-family: 'Cinzel', serif;
  font-size: 0.5rem;
  text-transform: uppercase;
  letter-spacing: 0.08em;
  padding: 2px 6px;
  border-radius: 2px;
  white-space: nowrap;
  flex-shrink: 0;
}
.badge-your-turn {
  background: rgba(200,168,75,0.2);
  border: 1px solid var(--gold-light);
  color: var(--gold-light);
  animation: blink 1s step-start infinite;
}
.badge-active {
  background: rgba(200,168,75,0.1);
  border: 1px solid var(--gold);
  color: var(--gold);
  animation: blink 1s step-start infinite;
}
.badge-you {
  background: rgba(154,112,0,0.15);
  border: 1px solid var(--gold);
  color: var(--gold-light);
}
.badge-party {
  background: rgba(42,90,24,0.15);
  border: 1px solid #3a6a28;
  color: #6aaa4a;
}
.badge-enemy {
  background: rgba(122,21,21,0.15);
  border: 1px solid #5a1818;
  color: #c04040;
}

@keyframes blink {
  0%, 100% { opacity: 1; }
  50% { opacity: 0.3; }
}

.cc-bar-wrap {
  background: rgba(0,0,0,0.4);
  border-radius: 2px;
  height: 4px;
  overflow: hidden;
  margin-bottom: 5px;
}
.cc-bar-fill {
  height: 100%;
  border-radius: 2px;
  transition: width 0.3s ease, background 0.3s ease;
}
.hp-green { background: #3a8020; }
.hp-gold  { background: #9a7000; }
.hp-red   { background: #8a1515; }

.cc-stats {
  font-family: 'Cinzel', serif;
  font-size: 0.5rem;
  color: var(--border-light);
  letter-spacing: 0.05em;
  margin-bottom: 4px;
}
.cc-hp-hidden {
  font-style: italic;
  color: var(--border-light);
  font-family: 'Crimson Text', serif;
  font-size: 0.65rem;
}

.cc-conditions {
  display: flex;
  flex-wrap: wrap;
  gap: 3px;
  margin-top: 4px;
}
.cond-pill {
  font-family: 'Cinzel', serif;
  font-size: 0.42rem;
  text-transform: uppercase;
  letter-spacing: 0.06em;
  padding: 1px 5px;
  border-radius: 2px;
  background: rgba(122,21,21,0.25);
  border: 1px solid #5a1818;
  color: #c04040;
}

/* ── RIGHT AREA ── */
#player-area {
  flex: 1;
  padding: 18px;
  overflow-y: auto;
  display: flex;
  flex-direction: column;
  gap: 14px;
}

/* My Stats Card */
#my-stats-card {
  background: linear-gradient(160deg, #1a0e04, #0d0802);
  border: 1px solid var(--border);
  border-radius: 4px;
  padding: 16px 20px;
  display: none;
}
.my-stats-title {
  font-family: 'Cinzel', serif;
  font-size: 0.58rem;
  text-transform: uppercase;
  letter-spacing: 0.15em;
  color: var(--gold);
  margin-bottom: 12px;
  padding-bottom: 8px;
  border-bottom: 1px solid var(--border);
}
.my-stats-grid {
  display: grid;
  grid-template-columns: 1fr 1fr 1fr;
  gap: 12px;
  margin-bottom: 12px;
}
.my-stat-block {
  text-align: center;
}
.my-stat-num {
  font-family: 'Cinzel', serif;
  font-size: 1.6rem;
  font-weight: 900;
  color: var(--gold-light);
  line-height: 1;
}
.my-stat-label {
  font-family: 'Cinzel', serif;
  font-size: 0.48rem;
  text-transform: uppercase;
  letter-spacing: 0.12em;
  color: var(--border-light);
  margin-top: 4px;
}
.my-hp-bar-wrap {
  background: rgba(0,0,0,0.4);
  border-radius: 3px;
  height: 6px;
  overflow: hidden;
  margin-bottom: 10px;
}
.my-hp-bar-fill {
  height: 100%;
  border-radius: 3px;
  transition: width 0.3s ease, background 0.3s ease;
}
.my-conditions {
  display: flex;
  flex-wrap: wrap;
  gap: 4px;
}

/* Enemies Section */
#enemies-section {
  display: none;
}
.enemies-label {
  font-family: 'Cinzel', serif;
  font-size: 0.52rem;
  text-transform: uppercase;
  letter-spacing: 0.15em;
  color: var(--red);
  margin-bottom: 8px;
}
.enemy-row {
  background: rgba(0,0,0,0.3);
  border: 1px solid #2a1010;
  border-radius: 3px;
  padding: 8px 10px;
  margin-bottom: 6px;
  transition: opacity 0.2s;
}
.enemy-row.unconscious { opacity: 0.4; }
.enemy-row-top {
  display: flex;
  align-items: center;
  justify-content: space-between;
  margin-bottom: 5px;
}
.enemy-row-name {
  font-family: 'Cinzel', serif;
  font-size: 0.72rem;
  color: var(--parchment);
}
.enemy-row-hp {
  font-family: 'Cinzel', serif;
  font-size: 0.55rem;
  color: var(--border-light);
  letter-spacing: 0.05em;
}
.enemy-bar-wrap {
  background: rgba(0,0,0,0.4);
  border-radius: 2px;
  height: 4px;
  overflow: hidden;
  margin-bottom: 5px;
}
.enemy-bar-fill {
  height: 100%;
  border-radius: 2px;
  transition: width 0.3s ease, background 0.3s ease;
}
.enemy-conditions {
  display: flex;
  flex-wrap: wrap;
  gap: 3px;
}

/* Result Banner */
#result-banner {
  display: none;
  border-radius: 4px;
  padding: 14px 20px;
  font-family: 'Cinzel', serif;
  font-size: 0.9rem;
  font-weight: 600;
  letter-spacing: 0.08em;
  text-align: center;
}
#result-banner.win  { background: rgba(42,90,24,0.3); border: 1px solid #3a6a28; color: #8ada58; }
#result-banner.loss { background: rgba(122,21,21,0.3); border: 1px solid #6a1818; color: #e06060; }
#result-banner.time { background: rgba(154,112,0,0.25); border: 1px solid var(--gold); color: var(--gold-light); }

/* Redirect message */
#redirect-msg {
  display: none;
  position: fixed;
  inset: 0;
  background: var(--bg);
  align-items: center;
  justify-content: center;
  flex-direction: column;
  gap: 12px;
  z-index: 999;
}
#redirect-msg.visible { display: flex; }
#redirect-msg-text {
  font-family: 'Cinzel', serif;
  font-size: 1.1rem;
  color: var(--parchment-dark);
  letter-spacing: 0.1em;
}
#redirect-msg-sub {
  font-family: 'Crimson Text', serif;
  font-size: 0.9rem;
  color: var(--border-light);
}

/* Loading overlay */
#loading-overlay {
  display: flex;
  position: fixed;
  inset: 0;
  background: var(--bg);
  align-items: center;
  justify-content: center;
  flex-direction: column;
  gap: 14px;
  z-index: 998;
}
#loading-overlay.hidden { display: none; }
#loading-text {
  font-family: 'Cinzel', serif;
  font-size: 0.8rem;
  text-transform: uppercase;
  letter-spacing: 0.2em;
  color: var(--border-light);
}
@keyframes loadingPulse { 0%,100% { opacity: 0.4; } 50% { opacity: 1; } }
#loading-sword { font-size: 2.5rem; animation: loadingPulse 1.5s ease-in-out infinite; }

/* ── TURN OVERLAY ── */
#turn-overlay {
  display: none;
  position: fixed;
  inset: 0;
  background: rgba(0,0,0,0.92);
  z-index: 500;
  align-items: center;
  justify-content: center;
  cursor: pointer;
}
#turn-overlay.visible { display: flex; }

#overlay-content {
  text-align: center;
}
#overlay-content.enter {
  animation: overlayEnter 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards;
}
#overlay-content.exit {
  animation: overlayExit 0.3s ease forwards;
}

@keyframes overlayEnter {
  from { opacity: 0; transform: scale(0.6); }
  to   { opacity: 1; transform: scale(1); }
}
@keyframes overlayExit {
  from { opacity: 1; transform: scale(1); }
  to   { opacity: 0; transform: scale(1.1); }
}

.overlay-sword {
  font-size: 3rem;
  margin-bottom: 16px;
  display: inline-block;
  animation: swordSwing 1.2s ease-in-out infinite;
}
@keyframes swordSwing {
  0%, 100% { transform: rotate(-25deg); }
  50%       { transform: rotate(25deg); }
}
.overlay-title {
  font-family: 'Cinzel', serif;
  font-size: 2.5rem;
  font-weight: 900;
  color: var(--gold-light);
  text-shadow: 0 0 30px rgba(200,168,75,0.8);
  margin-bottom: 12px;
}
.overlay-sub {
  font-family: 'Crimson Text', serif;
  font-size: 1.1rem;
  color: var(--parchment-dark);
  font-style: italic;
}
</style>
</head>
<body>

<!-- LOADING OVERLAY (shown until first snapshot fires) -->
<div id="loading-overlay">
  <div id="loading-sword">⚔️</div>
  <div id="loading-text">Loading Combat...</div>
</div>

<!-- REDIRECT MESSAGE -->
<div id="redirect-msg">
  <div id="redirect-msg-text">No Active Combat</div>
  <div id="redirect-msg-sub">Returning to campaign...</div>
</div>

<!-- TOP BAR -->
<div id="top-bar">
  <div id="top-bar-spacer-left">
    <button id="back-btn" onclick="goBack()">← Back to Campaign</button>
  </div>
  <div id="top-bar-center">
    <span id="round-display">
      <span id="round-label">Round </span><span id="round-num">—</span><span id="round-sep"> · </span><span id="round-cond">—</span>
    </span>
  </div>
  <div id="top-bar-spacer-right"></div>
</div>

<!-- MAIN AREA -->
<div id="main-area">

  <!-- LEFT: TURN QUEUE -->
  <div id="turn-queue">
    <div id="queue-label">⚡ Turn Order</div>
    <div id="queue-cards"></div>
    <button id="end-turn-btn" onclick="playerEndTurn()">End My Turn →</button>
  </div>

  <!-- RIGHT: PLAYER AREA -->
  <div id="player-area">

    <!-- My Stats -->
    <div id="my-stats-card">
      <div class="my-stats-title" id="my-stats-title">⚔ — Your Combat Stats</div>
      <div class="my-stats-grid">
        <div class="my-stat-block">
          <div class="my-stat-num" id="my-ac">—</div>
          <div class="my-stat-label">Armor Class</div>
        </div>
        <div class="my-stat-block">
          <div class="my-stat-num" id="my-hp">—</div>
          <div class="my-stat-label">HP</div>
        </div>
        <div class="my-stat-block">
          <div class="my-stat-num" id="my-maxhp">—</div>
          <div class="my-stat-label">Max HP</div>
        </div>
      </div>
      <div class="my-hp-bar-wrap">
        <div class="my-hp-bar-fill" id="my-hp-bar"></div>
      </div>
      <div class="my-conditions" id="my-conditions"></div>
    </div>

    <!-- Enemies Section -->
    <div id="enemies-section">
      <div class="enemies-label">☠ Enemies</div>
      <div id="enemies-list"></div>
    </div>

    <!-- Result Banner -->
    <div id="result-banner"></div>

  </div>
</div>

<!-- YOUR TURN OVERLAY -->
<div id="turn-overlay" onclick="dismissOverlay()">
  <div id="overlay-content">
    <div class="overlay-sword">⚔️</div>
    <div class="overlay-title" id="overlay-title">⚔ Your Turn!</div>
    <div class="overlay-sub">Take your action, bonus action, and movement</div>
  </div>
</div>

<script>
// ── Globals ──
const campaignId = new URLSearchParams(window.location.search).get('c');
if (!campaignId) window.location.href = 'dashboard.html';

let db;
let currentUser = null;
let _lastShownTurnIndex = -1;
let _overlayTimer = null;
let _overlayDismissing = false;

// ── Utilities ──
function escHtml(s) {
  return String(s)
    .replace(/&/g, '&amp;')
    .replace(/</g, '&lt;')
    .replace(/>/g, '&gt;')
    .replace(/"/g, '&quot;')
    .replace(/'/g, '&#39;');
}

function goBack() {
  window.location.href = 'index.html?c=' + campaignId;
}

function hpBarClass(pct) {
  if (pct > 0.6) return 'hp-green';
  if (pct > 0.3) return 'hp-gold';
  return 'hp-red';
}

// ── Loading / Redirect ──
function hideLoading() {
  document.getElementById('loading-overlay').classList.add('hidden');
}

function showRedirect() {
  hideLoading();
  document.getElementById('redirect-msg').classList.add('visible');
  setTimeout(goBack, 1500);
}

// ── Render ──
function renderCombat(state) {
  hideLoading();
  const combatants = state.combatants || [];
  const curIdx = state.currentTurnIndex ?? 0;
  const myId = currentUser ? 'p_' + currentUser.uid : null;

  // Round display
  document.getElementById('round-num').textContent = state.round ?? '—';
  const condLabel = state.winCond === 'timed'
    ? 'Timed (' + (state.maxRounds ?? '?') + ' Rounds)'
    : 'Until Victory';
  document.getElementById('round-cond').textContent = condLabel;

  renderQueue(combatants, curIdx, myId);
  renderResult(state.result);

  const me = myId ? combatants.find(c => c.id === myId) : null;
  renderMyStats(me);

  const enemies = combatants.filter(c => c.type === 'enemy');
  renderEnemies(enemies);

  // Check for your-turn overlay
  const activeCombatant = combatants[curIdx];
  if (
    activeCombatant &&
    activeCombatant.id === myId &&
    curIdx !== _lastShownTurnIndex
  ) {
    _lastShownTurnIndex = curIdx;
    if (localStorage.getItem('setting_turnOverlay') !== 'off') {
      showTurnOverlay(activeCombatant.name);
    }
  }
}

function renderQueue(combatants, curIdx, myId) {
  const container = document.getElementById('queue-cards');
  const endBtn = document.getElementById('end-turn-btn');

  // Show/hide end turn button
  const activeCombatant = combatants[curIdx];
  const isMyTurn = activeCombatant && activeCombatant.id === myId;
  endBtn.style.display = isMyTurn ? 'block' : 'none';

  if (!combatants.length) {
    container.innerHTML = '';
    return;
  }

  container.innerHTML = combatants.map((c, i) => {
    const isActive = i === curIdx;
    const isMe = c.id === myId;
    const isEnemy = c.type === 'enemy';
    const isDead = c.hp <= 0;

    const pct = c.maxHp > 0 ? c.hp / c.maxHp : 0;
    const barCls = hpBarClass(pct);

    // Card classes
    let cardCls = 'cc';
    if (isActive) cardCls += isMe ? ' active-turn is-me' : ' active-turn';
    if (isEnemy)  cardCls += ' is-enemy';
    if (isDead)   cardCls += ' unconscious';

    // Badge
    let badge = '';
    if (isActive && isMe) {
      badge = '<span class="cc-badge badge-your-turn">Your Turn</span>';
    } else if (isActive && !isMe) {
      badge = '<span class="cc-badge badge-active">Active</span>';
    } else if (!isActive && isMe) {
      badge = '<span class="cc-badge badge-you">You</span>';
    } else if (!isEnemy) {
      badge = '<span class="cc-badge badge-party">Party</span>';
    } else {
      badge = '<span class="cc-badge badge-enemy">Enemy</span>';
    }

    // HP display
    let hpText = '';
    if (!isEnemy) {
      hpText = escHtml('HP ' + c.hp + '/' + c.maxHp) + ' &nbsp; AC ' + escHtml(String(c.ac));
    } else {
      if (c.showHp) {
        hpText = escHtml('HP ' + c.hp + '/' + c.maxHp) + ' &nbsp; AC ' + escHtml(String(c.ac));
      } else {
        hpText = '<span class="cc-hp-hidden">HP Hidden</span> &nbsp; AC ' + escHtml(String(c.ac));
      }
    }

    // Condition pills
    const conditions = Array.isArray(c.conditions) ? c.conditions : [];
    const condHtml = conditions.length
      ? '<div class="cc-conditions">' +
          conditions.map(cn => '<span class="cond-pill">' + escHtml(cn) + '</span>').join('') +
        '</div>'
      : '';

    return `<div class="${escHtml(cardCls)}">
  <div class="cc-header">
    <span class="cc-name">${escHtml(c.name)}</span>
    ${badge}
  </div>
  <div class="cc-bar-wrap">
    <div class="cc-bar-fill ${escHtml(barCls)}" style="width:${Math.round(pct * 100)}%"></div>
  </div>
  <div class="cc-stats">${hpText}</div>
  ${condHtml}
</div>`;
  }).join('');
}

function renderMyStats(me) {
  const card = document.getElementById('my-stats-card');
  if (!me) { card.style.display = 'none'; return; }
  card.style.display = 'block';

  document.getElementById('my-stats-title').textContent = '⚔ ' + me.name + ' — Your Combat Stats';
  document.getElementById('my-ac').textContent = me.ac ?? '—';
  document.getElementById('my-hp').textContent = me.hp ?? '—';
  document.getElementById('my-maxhp').textContent = me.maxHp ?? '—';

  const pct = me.maxHp > 0 ? me.hp / me.maxHp : 0;
  const bar = document.getElementById('my-hp-bar');
  bar.style.width = Math.round(pct * 100) + '%';
  bar.className = 'my-hp-bar-fill ' + hpBarClass(pct);

  const conditions = Array.isArray(me.conditions) ? me.conditions : [];
  const condContainer = document.getElementById('my-conditions');
  condContainer.innerHTML = conditions
    .map(cn => '<span class="cond-pill">' + escHtml(cn) + '</span>')
    .join('');
}

function renderEnemies(enemies) {
  const section = document.getElementById('enemies-section');
  const list = document.getElementById('enemies-list');

  if (!enemies.length) { section.style.display = 'none'; return; }
  section.style.display = 'block';

  list.innerHTML = enemies.map(e => {
    const pct = e.maxHp > 0 ? e.hp / e.maxHp : 0;
    const barCls = hpBarClass(pct);
    const isDead = e.hp <= 0;
    const conditions = Array.isArray(e.conditions) ? e.conditions : [];

    let hpDisplay = '';
    if (e.showHp) {
      hpDisplay = '<span class="enemy-row-hp">' + escHtml('HP ' + e.hp + ' / ' + e.maxHp) + '</span>';
    } else {
      hpDisplay = '<span class="enemy-row-hp" style="font-style:italic;color:var(--border)">HP Hidden</span>';
    }

    const condHtml = conditions.length
      ? '<div class="enemy-conditions">' +
          conditions.map(cn => '<span class="cond-pill">' + escHtml(cn) + '</span>').join('') +
        '</div>'
      : '';

    return `<div class="enemy-row${isDead ? ' unconscious' : ''}">
  <div class="enemy-row-top">
    <span class="enemy-row-name">${escHtml(e.name)}</span>
    ${hpDisplay}
  </div>
  <div class="enemy-bar-wrap">
    <div class="enemy-bar-fill ${escHtml(barCls)}" style="width:${Math.round(pct * 100)}%"></div>
  </div>
  ${condHtml}
</div>`;
  }).join('');
}

function renderResult(result) {
  const banner = document.getElementById('result-banner');
  if (!result) { banner.style.display = 'none'; return; }

  banner.style.display = 'block';
  banner.className = 'win loss time'.includes(result) ? result : '';

  if (result === 'win') {
    banner.textContent = '🏆 Victory! All enemies have fallen.';
    banner.className = 'win';
  } else if (result === 'loss') {
    banner.textContent = '💀 Defeat. The party has fallen.';
    banner.className = 'loss';
  } else if (result === 'time') {
    banner.textContent = "⏳ Time's up! The battle has ended.";
    banner.className = 'time';
  }
}

// ── End Turn ──
async function playerEndTurn() {
  if (!db || !currentUser) return;
  const ref = db.collection('campaigns').doc(campaignId).collection('combat').doc('state');
  try {
    const snap = await ref.get();
    if (!snap.exists) return;
    const state = snap.data();
    const combatants = state.combatants || [];
    const myId = 'p_' + currentUser.uid;

    // Verify it's still my turn
    if (!combatants[state.currentTurnIndex] || combatants[state.currentTurnIndex].id !== myId) return;

    let nextIdx = state.currentTurnIndex + 1;
    let nextRound = state.round ?? 1;
    if (nextIdx >= combatants.length) {
      nextIdx = 0;
      nextRound += 1;
    }

    await ref.update({ currentTurnIndex: nextIdx, round: nextRound });
  } catch (err) {
    console.error('Error ending turn:', err);
  }
}

// ── Turn Overlay ──
function showTurnOverlay(name) {
  if (_overlayTimer) { clearTimeout(_overlayTimer); _overlayTimer = null; }
  _overlayDismissing = false;

  const overlay = document.getElementById('turn-overlay');
  const content = document.getElementById('overlay-content');
  document.getElementById('overlay-title').textContent = '⚔ Your Turn!';

  content.className = '';
  overlay.classList.add('visible');
  // Trigger reflow before adding animation class
  void content.offsetWidth;
  content.classList.add('enter');

  _overlayTimer = setTimeout(dismissOverlay, 2500);
}

function dismissOverlay() {
  if (_overlayDismissing) return;
  _overlayDismissing = true;

  if (_overlayTimer) { clearTimeout(_overlayTimer); _overlayTimer = null; }

  const overlay = document.getElementById('turn-overlay');
  const content = document.getElementById('overlay-content');

  content.classList.remove('enter');
  void content.offsetWidth;
  content.classList.add('exit');

  setTimeout(() => {
    overlay.classList.remove('visible');
    content.classList.remove('exit');
    _overlayDismissing = false;
  }, 300);
}

// ── Firebase Init ──
firebase.auth().onAuthStateChanged(user => {
  if (!user) {
    window.location.href = 'home.html';
    return;
  }
  currentUser = user;

  try {
    db = firebase.firestore();
    db.collection('campaigns').doc(campaignId)
      .collection('combat').doc('state')
      .onSnapshot(snap => {
        if (!snap.exists || snap.data().mode !== 'active') {
          showRedirect();
        } else {
          renderCombat(snap.data());
        }
      }, err => {
        console.error('Snapshot error:', err);
        showRedirect();
      });
  } catch (e) {
    console.error('Firebase error:', e);
    showRedirect();
  }
});
</script>
